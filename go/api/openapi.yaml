openapi: 3.0.3
info:
  description: |
    REST API for managing, executing, and monitoring workflows, human tasks, incidents, and outgoing webhooks inside the NativeBPM Cloud-Native engine.

    ### Authentication
    Requests must include a session cookie or a Bearer API token:
    `Authorization: Bearer <API_TOKEN>`
  title: NativeBPM Engine REST API
  version: 1.0.0
servers:
- url: /
paths:
  /api/definitions:
    get:
      description: Retrieve a list of all deployed process definitions.
      operationId: listDefinitions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProcessDefinition"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: List process definitions
  /api/deploy:
    post:
      description: Deploy a new BPMN 2.0 XML process definition.
      operationId: deployDefinition
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/deployDefinition_request"
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowAST"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessDefinition"
          description: Successful response
        "400":
          description: Invalid request body or malformed BPMN XML
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Deploy process definition
  /api/definitions/{id}/start:
    post:
      description: Start a new workflow process instance by process definition ID.
      operationId: startInstance
      parameters:
      - description: "The process definition ID (e.g., matching the BPMN process element\
          \ ID)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInstanceRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
          description: Successful response
        "400":
          description: Invalid variables or configuration
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Start process instance
  /api/process/execute:
    post:
      description: |
        Atomically deploys the workflow definition if changed (or not yet known) and immediately starts an execution instance.
        Supports lightweight repeat execution via contentHash and definitionId.
      operationId: executeProcess
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecuteProcessRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecuteProcessResponse"
          description: Process started successfully
        "400":
          description: Invalid workflow AST or input variables
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Definition hash unknown (requires full AST resubmission)
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Execute process with JIT auto-deploy
  /api/instances:
    get:
      description: Retrieve a list of active and completed process instances.
      operationId: listInstances
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ProcessInstance"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: List process instances
  /api/instances/{id}:
    get:
      description: Fetch a single process instance state by instance ID.
      operationId: getInstance
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "404":
          description: Process instance not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Get process instance
  /api/instances/{id}/visualization:
    get:
      description: "Retrieve diagram XML, execution node status, and history events\
        \ for visualization."
      operationId: getInstanceVisualization
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualizationData"
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "404":
          description: Process instance not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Get process instance visualization data
  /api/instances/{id}/visualization/widget:
    get:
      description: Retrieve the ready-to-embed HTML process visualization widget.
      operationId: getInstanceVisualizationWidget
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: "Optional custom title for the visualization widget. If empty,\
          \ the title header is hidden."
        explode: true
        in: query
        name: title
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "404":
          description: Process instance not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Get process instance visualization widget HTML
  /api/instances/{id}/history:
    get:
      description: Fetch the audit trail / execution history log for a process instance.
      operationId: getInstanceHistory
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/HistoryRecord"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Get process instance execution history
  /api/instances/{id}/incidents:
    get:
      description: Get active execution incidents (failures) for a specific process
        instance.
      operationId: listIncidents
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/IncidentRecord"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "404":
          description: Process instance not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: List incidents for process instance
  /api/instances/{id}/complete:
    post:
      description: Complete a specific active node/wait state within a process instance.
      operationId: completeInstanceTask
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteInstanceTaskRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
          description: Process instance state after completion
        "400":
          description: Missing parameter node_id or invalid payload
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Complete a wait state / task activity in process instance
  /api/instances/{id}/resume:
    post:
      description: Manually trigger execution resumption of a process instance.
      operationId: resumeInstance
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
          description: Process instance state after resuming
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Resume process instance
  /api/instances/{id}/incidents/{incidentId}/resolve:
    post:
      description: "Resolve a process execution failure incident, triggering retry/resume."
      operationId: resolveIncident
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: incidentId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/resolveIncident_200_response"
          description: Incident resolved successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Resolve process incident
  /api/tasks:
    get:
      description: "Query tasks matching criteria (assignee, candidateGroup, status)."
      operationId: listTasks
      parameters:
      - explode: true
        in: query
        name: assignee
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: candidateGroup
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - CREATED
          - CLAIMED
          - COMPLETED
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/TaskRecord"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: List human/user tasks
  /api/tasks/{id}/claim:
    post:
      description: Claim a task for a specific user assignee.
      operationId: claimTask
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/claimTask_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskRecord"
          description: Task claimed successfully
        "400":
          description: Task cannot be claimed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Task not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Claim human task
  /api/tasks/{id}/complete:
    post:
      description: "Complete a claimed human task, providing results variables."
      operationId: completeTask
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/completeTask_request"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstance"
          description: Task completed successfully
        "400":
          description: Task is not claimed
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Task not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Complete human task
  /api/webhooks:
    get:
      description: List all registered webhook targets.
      operationId: listWebhooks
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WebhookRecord"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: List configured outgoing webhooks
    post:
      description: Register a new webhook target.
      operationId: createWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRecord"
          description: Webhook created successfully
        "400":
          description: Invalid URL or events list
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Create webhook target
  /api/webhooks/{id}:
    delete:
      description: Delete a webhook configuration.
      operationId: deleteWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/resolveIncident_200_response"
          description: Webhook deleted successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Webhook not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Delete webhook target
    put:
      description: Modify the configuration of an existing webhook.
      operationId: updateWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebhookRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookRecord"
          description: Webhook updated successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Webhook not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Update webhook target
  /api/webhooks/{id}/test:
    post:
      description: Send a test ping event delivery to verification URL.
      operationId: testWebhook
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/resolveIncident_200_response"
          description: Test ping sent successfully
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Webhook not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Test webhook target
  /api/webhooks/{id}/deliveries:
    get:
      description: Get delivery audit logs and history queue for a specific webhook
        target.
      operationId: listWebhookDeliveries
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/WebhookDeliveryRecord"
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: Webhook not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: List deliveries for webhook
  /api/users/{username}/groups:
    get:
      description: Retrieve the list of groups (chats) the user is a member of.
      operationId: getUserGroups
      parameters:
      - description: The username to retrieve groups for
        explode: false
        in: path
        name: username
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Get user groups
  /api/smtp-config:
    get:
      description: Retrieve the current SMTP mailer configuration (admin/developer
        only).
      operationId: getSMTPConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMTPConfig"
          description: Successful response
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Unauthorized - missing or invalid session cookie / API Bearer
            Token
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listDefinitions_401_response"
          description: Forbidden - insufficient operator permissions or role level
        "404":
          description: SMTP config not found
        "500":
          description: Internal Server Error - database failure or execution crash
      summary: Get SMTP configuration
components:
  responses:
    "401Unauthorized":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/listDefinitions_401_response"
      description: Unauthorized - missing or invalid session cookie / API Bearer Token
    "403Forbidden":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/listDefinitions_401_response"
      description: Forbidden - insufficient operator permissions or role level
    "500InternalError":
      description: Internal Server Error - database failure or execution crash
  schemas:
    VisualizationData:
      example:
        instance_id: instance_id
        definition_id: definition_id
        xml: xml
        active_nodes:
        - active_nodes
        - active_nodes
        waiting_nodes:
        - waiting_nodes
        - waiting_nodes
        completed_nodes:
        - completed_nodes
        - completed_nodes
        history:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          instance_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          node_id: node_id
          node_name: node_name
          node_type: node_type
          action: start
          variables: "{}"
          timestamp: 2000-01-23T04:56:07.000+00:00
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          instance_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          node_id: node_id
          node_name: node_name
          node_type: node_type
          action: start
          variables: "{}"
          timestamp: 2000-01-23T04:56:07.000+00:00
        completed: true
      properties:
        instance_id:
          type: string
        definition_id:
          type: string
        xml:
          type: string
        active_nodes:
          items:
            type: string
          type: array
        waiting_nodes:
          items:
            type: string
          type: array
        completed_nodes:
          items:
            type: string
          type: array
        history:
          items:
            $ref: "#/components/schemas/HistoryRecord"
          type: array
        completed:
          type: boolean
      required:
      - active_nodes
      - completed
      - completed_nodes
      - definition_id
      - history
      - instance_id
      - waiting_nodes
      - xml
      type: object
